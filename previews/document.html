<!DOCTYPE html>
<!-- STATIC PREVIEW of templates/document.html — sample data, no backend. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview — Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    .urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.4; direction: rtl; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen" x-data="preview()">

  <header class="border-b border-slate-800 bg-slate-950/60 sticky top-0 z-20 backdrop-blur">
    <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <a href="./dashboard.html" class="text-slate-400 hover:text-white">← Dashboard</a>
        <h1 class="text-lg font-semibold">Behes Tansikh</h1>
      </div>
      <div class="flex items-center gap-3">
        <a href="#" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold">Export .docx</a>
        <a href="#" class="text-red-400 hover:text-red-300 text-sm">Logout</a>
      </div>
    </div>
  </header>

  <main class="max-w-screen-2xl mx-auto px-6 py-6">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div class="flex items-center gap-2">
        <button @click="prev()" :disabled="idx<=0" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-40">‹ Prev</button>
        <span class="text-slate-300" x-text="'Page '+(idx+1)+' of '+pages.length"></span>
        <button @click="next()" :disabled="idx>=pages.length-1" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-40">Next ›</button>
        <button @click="nextToReview()" class="px-3 py-1.5 rounded-lg bg-amber-600/80 hover:bg-amber-500 text-sm">Next to review ⟶</button>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-slate-400" x-text="verifiedCount+' / '+pages.length+' verified'"></span>
        <span class="text-sm text-slate-400">Confidence</span>
        <span class="px-3 py-1 rounded-full text-sm font-semibold" :class="confClass(current.confidence)" x-text="Math.round(current.confidence*100)+'%'"></span>
        <span x-show="current.confidence < 0.6 && !current.verified" class="text-amber-300 text-sm">⚠ Needs proofreading</span>
        <button class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm">Copy</button>
        <button class="px-2.5 py-1 rounded-lg bg-sky-700 hover:bg-sky-600 text-sm">Re-run page</button>
        <label class="flex items-center gap-1.5 cursor-pointer select-none px-2.5 py-1 rounded-lg" :class="current.verified ? 'bg-emerald-600/30 text-emerald-300' : 'bg-slate-800'">
          <input type="checkbox" :checked="current.verified" @change="current.verified=$event.target.checked" class="accent-emerald-500" />
          <span class="text-sm">Verified</span>
        </label>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" style="height: calc(100vh - 200px)">
      <!-- Left: faux scanned page image -->
      <div class="bg-slate-950 rounded-xl border border-slate-800 overflow-auto flex items-start justify-center p-4">
        <img :src="pageImage(current)" class="max-w-full rounded shadow-lg" alt="page image" />
      </div>
      <!-- Right: editable text -->
      <div class="bg-slate-950 rounded-xl border border-slate-800 flex flex-col">
        <div class="px-4 py-2 border-b border-slate-800 text-xs text-slate-500 flex justify-between">
          <span>Reconciled Urdu text — editable</span>
          <span class="italic truncate max-w-md" x-text="current.notes"></span>
        </div>
        <textarea x-model="current.text" class="urdu flex-1 w-full bg-transparent p-6 text-xl resize-none focus:outline-none" spellcheck="false"></textarea>
      </div>
    </div>
  </main>

  <script>
    function preview() {
      return {
        idx: 0,
        pages: [
          { page_number:1, confidence:0.95, verified:true,  notes:'Both transcriptions agreed.',
            text:'بحث تناسخ\nمصنفہ پنڈت لیکھرام آریہ\nطبع ہوئی بماہ اکتوبر سنہ ۹۹ء' },
          { page_number:2, confidence:0.52, verified:false, notes:'Lower edge faint; verify last line.',
            text:'دیباچہ\nاسمیں کچھ شک نہیں کہ باپ دادا کے طریق کو\nباوجود غلط ہونے کے بھی چھوڑنا مشکل امر ہے' },
          { page_number:3, confidence:0.88, verified:false, notes:'',
            text:'تشریح سوال اول\nآریہ کہتے ہیں کہ دنیا میں جو مخلوق مختلف\nدرجوں کی معلوم ہوتی ہے کوئی امیر کوئی غریب' },
        ],
        get current() { return this.pages[this.idx]; },
        get verifiedCount() { return this.pages.filter(p=>p.verified).length; },
        prev() { if (this.idx>0) this.idx--; },
        next() { if (this.idx<this.pages.length-1) this.idx++; },
        nextToReview() {
          const n=this.pages.length;
          for (let s=1;s<=n;s++){const j=(this.idx+s)%n;const p=this.pages[j];if(!p.verified||p.confidence<0.6){this.idx=j;return;}}
          alert('All pages verified and high-confidence. 🎉');
        },
        confClass(c){ if(c>=0.85)return 'bg-emerald-500/25 text-emerald-300'; if(c>=0.6)return 'bg-amber-500/25 text-amber-300'; return 'bg-red-500/25 text-red-300'; },
        pageImage(p) {
          const lines = p.text.split('\n').map((t,i)=>
            `<text x="560" y="${90+i*70}" font-family="Noto Nastaliq Urdu, serif" font-size="30" fill="#1a1a1a" text-anchor="end" direction="rtl">${t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text>`).join('');
          const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800">
            <rect width="600" height="800" fill="#fbf8ef"/>
            <rect x="20" y="20" width="560" height="760" fill="none" stroke="#d8cfb8" stroke-width="2"/>
            <text x="300" y="50" font-family="serif" font-size="16" fill="#9a8" text-anchor="middle">— scanned page ${p.page_number} (preview) —</text>
            ${lines}</svg>`;
          return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
        },
      };
    }
  </script>
</body>
</html>
